<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test: klare CD-Hülle</title>
<!-- Test zum Ausprobieren: klare Jewel-Case mit Mikrokratzern und wanderndem Lichtreflex.
     Gehört nicht zur App, nur zum Anschauen auf dem iPhone. -->
<style>
  :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.43px; }
  .top { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 14px); text-align: center; font-size: 13px; color: rgba(235,235,245,.6); }
  .stage { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 50px); height: 58vh;
    perspective: 820px; perspective-origin: 50% 40%; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .item { position: absolute; left: 50%; top: 42%; width: 0; height: 0; transform-style: preserve-3d; }
  .info { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 50px + 58vh + 6px); text-align: center; }
  .info b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.45px; }
  .info span { font-size: 15px; color: rgba(235,235,245,.6); }
  .opts { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 22px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .opts small { font-size: 13px; color: rgba(235,235,245,.6); }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); box-shadow: inset 0 1px .5px rgba(255,255,255,.42), inset 0 0 0 .5px rgba(255,255,255,.12); }
  .seg button { border: 0; background: none; color: rgba(235,235,245,.6); font: 600 15px -apple-system, system-ui, sans-serif; padding: 8px 16px; border-radius: 999px; }
  .seg button.on { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.14)); color: #fff; }

  /* ================= Klare Jewel-Case als 3D-Kästchen ================= */
  .jc { --s: 200px; --w: calc(var(--s) * 1.136); --t: calc(var(--s) * 0.083);
    position: absolute; width: var(--w); height: var(--s); left: calc(var(--w) / -2); top: calc(var(--s) / -2);
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.25,.4,1); }
  .item.flipped .jc { transform: rotateY(180deg) scale(1.2); }
  .face { position: absolute; top: 0; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .front { left: 0; width: 100%; transform: translateZ(calc(var(--t) / 2)); border-radius: 3px; overflow: hidden; }
  .back { left: 0; width: 100%; transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); }
  .side-l { left: calc(var(--t) / -2); width: var(--t); transform: rotateY(-90deg); }
  .side-r { left: calc(100% - var(--t) / 2); width: var(--t); transform: rotateY(90deg); }

  /* Booklet unter dem klaren Deckel */
  .booklet { position: absolute; top: 2.4%; bottom: 2.4%; right: 3%; aspect-ratio: 1; background: #1c1c1e center/cover no-repeat; }
  /* klares Scharnier: nur Plastik, feine Kanten, zwei Gelenk-Nasen */
  .hinge { position: absolute; left: 0; top: 0; bottom: 0; width: 10.5%;
    background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.02) 45%, rgba(255,255,255,.06) 85%, rgba(255,255,255,.14)),
      linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), var(--img) 0 50% / 1400% auto no-repeat, #1c1c1e;
    box-shadow: inset -1px 0 0 rgba(255,255,255,.26), inset 1px 0 0 rgba(255,255,255,.12); }
  .hinge::before, .hinge::after { content: ""; position: absolute; left: 24%; right: 30%; height: 10%; border-radius: 3px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.035); }
  .hinge::before { top: 6%; } .hinge::after { bottom: 6%; }

  /* Breiter, weicher Glanz – wandert beim Blättern über die Hülle */
  .sheen { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(112deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.16) 44%, rgba(255,255,255,.05) 50%, rgba(255,255,255,0) 58%);
    background-size: 320% 100%; background-position: var(--sx, 50%) 0; }
  /* Mikrokratzer: nur dort sichtbar, wo gerade Licht hinfällt */
  .scratch { position: absolute; inset: 0; pointer-events: none; background-size: 340px 340px; background-position: var(--tx, 0) var(--ty, 0);
    opacity: var(--sk, .9);
    -webkit-mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.7) 26%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.1) 100%);
    mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.7) 26%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.1) 100%); }
  /* heller Lichtpunkt */
  .spot { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), rgba(255,255,255,.2), rgba(255,255,255,.05) 22%, rgba(255,255,255,0) 42%); }
  /* Kanten des Deckels */
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12); }
  .rim::after { content: ""; position: absolute; top: 2.4%; bottom: 2.4%; right: 3%; aspect-ratio: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

  /* Rücken (links): Einleger-Rücken hinter klarem Plastik */
  .side-l { background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.16)),
      linear-gradient(rgba(0,0,0,.38), rgba(0,0,0,.38)), var(--img) 50% 50% / 1400% auto no-repeat, #2c2c2e;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .spine { writing-mode: vertical-rl; transform: rotate(180deg); font-size: calc(var(--t) * .42); font-weight: 700; letter-spacing: .08em; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.6); white-space: nowrap; text-transform: uppercase; }
  /* Öffnungskante (rechts): klares Plastik */
  .side-r { background: linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,.05) 40%, rgba(255,255,255,.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }

  /* Rückseite beim Umdrehen: so wie jetzt in der App (Glas-Karte mit Titelliste) */
  .back { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgba(62,62,68,.94), rgba(28,28,30,.97));
    box-shadow: inset 0 1px .5px rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.12); }
  .back .head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 12px; border-bottom: .5px solid rgba(84,84,88,.6); }
  .back .head div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .back .head b { font-size: 14px; } .back .head span { font-size: 12px; color: rgba(235,235,245,.6); }
  .back .play { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; }
  .back ol { margin: 0; padding: 4px 10px 8px 30px; overflow: auto; font-size: 12px; line-height: 2; color: rgba(255,255,255,.92); }

  /* Spiegelung auf dem Boden (deckend wie beim iPod) */
  .refl { position: absolute; left: 0; right: 0; top: calc(100% + 2px); height: 46%; overflow: hidden; transform: translateZ(calc(var(--t) / 2)); }
  .refl > .inner { position: absolute; left: 0; right: 0; top: 0; height: 217.4%; transform: scaleY(-1); }
  .refl > .inner > .face { transform: none; }
  .refl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.58), rgba(0,0,0,.9) 50%, #000 85%); }
  .item.flipped .refl { opacity: 0; }
</style>
</head>
<body>
<div class="top">Test: klare CD-Hülle · wischen zum Blättern · antippen zum Umdrehen</div>
<div class="stage" id="stage"></div>
<div class="info"><b id="t"></b><span id="u"></span></div>
<div class="opts">
  <small>Kratzer</small>
  <div class="seg" id="sk">
    <button data-v="0">aus</button><button data-v=".55">wenig</button><button data-v=".9" class="on">mittel</button><button data-v="1.35">stark</button>
  </div>
</div>
<script>
// Test-Alben (Green Day) – Cover vom Cover Art Archive
const ALBUMS = [
  ['Kerplunk!', '1991', 'a0603694-2422-3a40-b946-d0bcea5e8254'],
  ['Dookie', '1994', '314cffd4-daa5-3337-85e5-e54165a96113'],
  ['Insomniac', '1995', '061f572e-7660-3c6b-b4cd-cf66d46da93c'],
  ['nimrod.', '1997', '4f1d08f2-d4bd-3ef2-ba72-eb348ae4c332'],
  ['Warning:', '2000', 'c1604b20-37b8-3fc7-8726-73f41090b8e2'],
  ['American Idiot', '2004', 'de9bf827-a9b0-348b-a7c9-556c03c3fb07'],
  ['21st Century Breakdown', '2009', '37608ff2-3168-3e7c-a77e-04a4b7300c1b'],
  ['Revolution Radio', '2016', '6721d62d-8d2d-4747-8548-308ecc4b914b'],
  ['Saviors', '2024', 'c1417e42-7eac-4817-bb1e-dba7a7ba044e'],
];
const TRACKS = ['Burnout', 'Having a Blast', 'Chump', 'Longview', 'Welcome to Paradise', 'Pulling Teeth', 'Basket Case', 'She', 'Sassafras Roots', 'When I Come Around', 'Coming Clean', 'Emenius Sleepus', 'In the End', 'F.O.D.'];

// ---------- Mikrokratzer-Textur einmal erzeugen (zufällige Haarlinien + Wisch-Kringel + Staub) ----------
function scratchTexture() {
  const S = 680, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.lineCap = 'round';
  for (let i = 0; i < 420; i++) { // feine gerade Haarlinien
    const x = Math.random() * S, y = Math.random() * S, len = 6 + Math.random() * Math.random() * 90, a = Math.random() * Math.PI;
    g.strokeStyle = `rgba(255,255,255,${0.14 + Math.random() * 0.4})`;
    g.lineWidth = Math.random() < 0.8 ? 1.2 : 2;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len / 2 + (Math.random() - 0.5) * 6, y + Math.sin(a) * len / 2 + (Math.random() - 0.5) * 6, x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  for (let k = 0; k < 2; k++) { // kreisförmige Wischspuren vom Putzen
    const cx = Math.random() * S, cy = Math.random() * S;
    for (let i = 0; i < 80; i++) {
      const r = 40 + Math.random() * S * 0.6, a0 = Math.random() * Math.PI * 2;
      g.strokeStyle = `rgba(255,255,255,${0.06 + Math.random() * 0.16})`;
      g.lineWidth = 1.1;
      g.beginPath(); g.arc(cx, cy, r, a0, a0 + 0.08 + Math.random() * 0.45); g.stroke();
    }
  }
  for (let i = 0; i < 220; i++) { // Staub und winzige Punkte
    g.fillStyle = `rgba(255,255,255,${0.1 + Math.random() * 0.45})`;
    const r = Math.random() < 0.9 ? 1 : 1.8;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, r, 0, Math.PI * 2); g.fill();
  }
  return c.toDataURL('image/png');
}
const TEX = scratchTexture();

function face(a, i) {
  // jede Hülle bekommt einen anderen Ausschnitt der Kratzer-Textur
  return `<div class="face front" style="--tx:${(i * 137) % 340}px;--ty:${(i * 211) % 340}px">
    <div class="booklet" style="background-image:url('https://coverartarchive.org/release-group/${a[2]}/front-500')"></div>
    <div class="hinge"></div>
    <div class="sheen"></div>
    <div class="scratch" style="background-image:url(${TEX})"></div>
    <div class="spot"></div>
    <div class="rim"></div>
  </div>`;
}

const stage = document.getElementById('stage');
stage.innerHTML = ALBUMS.map((a, i) => `<div class="item" data-i="${i}">
  <div class="jc" style="--img:url('https://coverartarchive.org/release-group/${a[2]}/front-250')">
    ${face(a, i)}
    <div class="face back">
      <div class="head"><div><b>${a[0]}</b><span>Green Day</span></div><span class="play"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 4v16l13 -8z" fill="currentColor"/></svg></span></div>
      <ol>${TRACKS.map((t) => `<li>${t}</li>`).join('')}</ol>
    </div>
    <div class="face side-l"><span class="spine">Green Day · ${a[0]}</span></div>
    <div class="face side-r"></div>
    <div class="refl"><div class="inner">${face(a, i)}</div></div>
  </div>
</div>`).join('');
const els = [...stage.querySelectorAll('.item')];

let pos = 1, target = 1, raf = 0, shown = -1, flipped = -1;
function layout() {
  const s = Math.round(Math.min(stage.clientWidth * 0.5, stage.clientHeight * 0.55, 300));
  const w = s * 1.136;
  els.forEach((el, i) => {
    const d = i - pos, ad = Math.abs(d);
    if (ad > 6) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.firstElementChild.style.setProperty('--s', `${s}px`);
    const c = Math.max(-1, Math.min(1, d));
    const r = Math.min(1, ad * 1.6) * Math.sign(d);
    const x = (c * 0.44 + d * 0.14) * w;
    const z = -Math.min(1, ad) * 0.45 * s;
    el.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${(-r * 70).toFixed(2)}deg)`;
    el.style.zIndex = String(1000 - Math.round(ad * 100));
    // Licht: Glanzpunkt und Glanzstreifen wandern mit der Bewegung über die Hülle
    el.style.setProperty('--lx', `${(32 - d * 70).toFixed(1)}%`);
    el.style.setProperty('--ly', `${(20 + Math.min(ad, 2) * 8).toFixed(1)}%`);
    el.style.setProperty('--sx', `${(50 + d * 55).toFixed(1)}%`);
  });
  const cur = Math.max(0, Math.min(ALBUMS.length - 1, Math.round(pos)));
  if (cur !== shown) {
    shown = cur;
    document.getElementById('t').textContent = ALBUMS[cur][0];
    document.getElementById('u').textContent = `Green Day · ${ALBUMS[cur][1]}`;
    if (flipped >= 0 && flipped !== cur) { els[flipped].classList.remove('flipped'); flipped = -1; }
  }
}
function animate() {
  cancelAnimationFrame(raf);
  const step = () => {
    const diff = target - pos;
    if (Math.abs(diff) < 0.002) { pos = target; layout(); return; }
    pos += diff * 0.16; layout(); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  cancelAnimationFrame(raf);
  drag = { x: e.clientX, pos, lastX: e.clientX, lastT: performance.now(), vel: 0, moved: false, item: e.target.closest('.item') };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  const s = Math.min(stage.clientWidth * 0.5, stage.clientHeight * 0.55, 300) * 0.34;
  pos = Math.max(-0.4, Math.min(ALBUMS.length - 0.6, drag.pos - dx / s));
  const now = performance.now(), dt = Math.max(1, now - drag.lastT);
  drag.vel = drag.vel * 0.6 + (-(e.clientX - drag.lastX) / s / dt * 1000) * 0.4;
  drag.lastX = e.clientX; drag.lastT = now;
  layout();
});
const end = () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) {
    const i = d.item ? Number(d.item.dataset.i) : Math.round(pos);
    if (i === Math.round(target) && Math.abs(pos - i) < 0.3) {
      if (flipped === i) { els[i].classList.remove('flipped'); flipped = -1; }
      else { if (flipped >= 0) els[flipped].classList.remove('flipped'); els[i].classList.add('flipped'); flipped = i; }
    } else { target = i; animate(); }
    return;
  }
  target = Math.max(0, Math.min(ALBUMS.length - 1, Math.round(pos + Math.max(-6, Math.min(6, d.vel * 0.22)))));
  animate();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
window.addEventListener('resize', layout);

// Kratzer-Stärke umschalten
document.getElementById('sk').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#sk button').forEach((x) => x.classList.toggle('on', x === b));
  document.documentElement.style.setProperty('--sk', b.dataset.v);
});
layout();
</script>
</body>
</html>
