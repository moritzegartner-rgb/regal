<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test: CD-Hülle</title>
<!-- Test zum Ausprobieren: klassische Jewel Case möglichst nah am Original –
     geschlossener 3D-Körper (keine Lücken an den Kanten), Öffnungs-Schlitz, abgerundete Kanten, Scharnier,
     Halte-Nasen, matter geriffelter Rand, Mikrokratzer, Abrieb, Fingerabdruck, wandernder Lichtreflex,
     echte Rückseite mit Titelliste, Rücken aus dem linken Cover-Streifen, Spiegelung inkl. Rücken.
     Gehört nicht zur App, nur zum Anschauen auf dem iPhone. -->
<style>
  :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.43px; }
  .top { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 14px); text-align: center; font-size: 13px; color: rgba(235,235,245,.6); }
  .stage { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 50px); height: 56vh;
    perspective: 820px; perspective-origin: 50% 40%; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .item { position: absolute; left: 50%; top: 42%; width: 0; height: 0; transform-style: preserve-3d; }
  .info { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 50px + 56vh + 4px); text-align: center; }
  .info b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.45px; }
  .info span { font-size: 15px; color: rgba(235,235,245,.6); }
  .opts { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 18px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .row small { font-size: 13px; color: rgba(235,235,245,.6); }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); box-shadow: inset 0 1px .5px rgba(255,255,255,.42), inset 0 0 0 .5px rgba(255,255,255,.12); }
  .seg button { border: 0; background: none; color: rgba(235,235,245,.6); font: 600 15px -apple-system, system-ui, sans-serif; padding: 8px 16px; border-radius: 999px; }
  .seg button.on { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.14)); color: #fff; }

  /* ============ Jewel Case – Maße wie im Original: 142 × 125 × 10,4 mm ============ */
  /* --b: Rundung der senkrechten Kanten, --e: Überlappung der Flächen (damit an den Kanten nichts durchscheint) */
  .jc { --s: 200px; --w: calc(var(--s) * 1.136); --t: calc(var(--s) * 0.083); --b: calc(var(--t) * 0.14); --e: .75px;
    position: absolute; width: var(--w); height: var(--s); left: calc(var(--w) / -2); top: calc(var(--s) / -2);
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.2,.4,1); }
  .item.flipped .jc { transform: rotateY(180deg) scale(1.3); }
  .stage.inspect .item.flipped .jc { transform: rotateY(180deg); }
  .face { position: absolute; top: 0; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  /* undurchsichtiger Kern in der Mitte: fängt jeden Blick durch Kanten ab */
  .core { position: absolute; left: 1px; top: 1px; width: calc(100% - 2px); height: calc(100% - 2px); background: #0a0a0b; }
  .front, .back { left: calc(var(--b) - var(--e)); width: calc(100% - 2 * var(--b) + 2 * var(--e)); }
  .front { transform: translateZ(calc(var(--t) / 2)); }
  .back { transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); }
  /* gerundete Kanten als schmale Schrägflächen */
  .bev { width: calc(var(--b) * 1.4142 + 2 * var(--e)); }
  .bev.fl, .bev.bl { left: calc(var(--b) * -0.2071 - var(--e)); }
  .bev.fr, .bev.br { left: calc(100% - var(--b) * 1.2071 - var(--e)); }
  .bev.fl { transform: translateZ(calc((var(--t) - var(--b)) / 2)) rotateY(-45deg); background: linear-gradient(90deg, #19191b, #222225 55%, #1c1c1e); }
  .bev.bl { transform: translateZ(calc((var(--b) - var(--t)) / 2)) rotateY(-135deg); background: linear-gradient(90deg, #1c1c1e, #222225 45%, #19191b); }
  .bev.fr { transform: translateZ(calc((var(--t) - var(--b)) / 2)) rotateY(45deg);
    background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,var(--bvr, .2)) 45%, rgba(255,255,255,.05)), #161618; }
  .bev.br { transform: translateZ(calc((var(--b) - var(--t)) / 2)) rotateY(135deg);
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.2) 55%, rgba(255,255,255,.1)), #161618; }
  .side-l, .side-r { width: calc(var(--t) - 2 * var(--b) + 2 * var(--e)); }
  .side-l { left: calc((var(--t) - 2 * var(--b)) / -2 - var(--e)); transform: rotateY(-90deg); }
  .side-r { left: calc(100% - (var(--t) - 2 * var(--b)) / 2 - var(--e)); transform: rotateY(90deg); }
  .face.top-f, .face.bot-f { left: 0; width: 100%; height: var(--t);
    clip-path: polygon(var(--b) 0, calc(100% - var(--b)) 0, 100% var(--b), 100% calc(100% - var(--b)), calc(100% - var(--b)) 100%, var(--b) 100%, 0 calc(100% - var(--b)), 0 var(--b)); }
  .face.top-f { top: calc(var(--t) / -2); transform: rotateX(90deg);
    background: linear-gradient(0deg, rgba(255,255,255,.3), rgba(255,255,255,.08) 7%, rgba(255,255,255,.05) 15%, #000 15% 17%, rgba(255,255,255,.2) 17% 19.5%, rgba(255,255,255,.06) 22%, rgba(255,255,255,.04) 92%, rgba(255,255,255,.14)), #111113; }
  .face.bot-f { top: calc(var(--s) - var(--t) / 2); transform: rotateX(-90deg);
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.06) 7%, rgba(255,255,255,.04) 15%, #000 15% 17%, rgba(255,255,255,.14) 17% 19.5%, rgba(255,255,255,.04) 22%, rgba(255,255,255,.03) 92%, rgba(255,255,255,.1)), #0c0c0e; }

  /* ---------- Vorderseite: klarer Deckel über schwarzem Träger ---------- */
  .lid { position: absolute; inset: 0; overflow: hidden; border-radius: 1px; background: #0b0b0c; }
  .tray { position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 20%, #19191b, #0a0a0b 70%); }
  /* geriffelter schwarzer Rand am Scharnier: matt, spiegelt nicht, keine Kratzer */
  .ribs { position: absolute; left: 0; top: 0; bottom: 0; width: 8%;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.12) 1px 2px, rgba(0,0,0,0) 2px 3px),
      linear-gradient(90deg, #232326, #1b1b1d 60%, #1f1f22);
    box-shadow: inset -1px 0 0 rgba(0,0,0,.65); }
  /* Booklet: Papier, nie ganz gerade eingelegt und nie ganz flach */
  .booklet { position: absolute; top: 2.3%; bottom: 2.3%; right: 2.6%; aspect-ratio: 1; background: #1c1c1e center/cover no-repeat;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.7);
    transform: translate(var(--ox, 0), var(--oy, 0)) rotate(var(--rot, 0deg)); }
  .booklet::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(165deg, rgba(255,255,255,.06), rgba(255,255,255,0) 35%, rgba(0,0,0,.05) 70%, rgba(0,0,0,.13)),
      linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 2.5%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  /* Halte-Nasen im Deckel, die das Booklet festhalten */
  .tab { position: absolute; width: 2.2%; height: 8%; border-radius: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.17)); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.34), 0 0 1.5px rgba(0,0,0,.6); }
  .tab.r1 { right: 1.2%; top: 10%; } .tab.r2 { right: 1.2%; bottom: 10%; }
  .tab.l1 { left: 9.2%; top: 10%; } .tab.l2 { left: 9.2%; bottom: 10%; }

  /* Glanzschicht des klaren Plastiks – nur über dem klaren Teil, nicht über dem matten Rand */
  .gloss { position: absolute; top: 0; bottom: 0; left: 8%; right: 0; overflow: hidden; pointer-events: none; }
  .gloss.bk { left: 0; right: 6%; }
  .lip { position: absolute; left: 0; right: 0; height: 1.3%; }
  .lip.t { top: 0; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04)); box-shadow: 0 .5px 0 rgba(255,255,255,.18); }
  .lip.b { bottom: 0; background: linear-gradient(0deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); box-shadow: 0 -.5px 0 rgba(255,255,255,.14); }
  .sheen { position: absolute; inset: 0;
    background: linear-gradient(112deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.15) 43%, rgba(255,255,255,.055) 49%, rgba(255,255,255,0) 57%);
    background-size: 320% 100%; background-position: var(--sx, 50%) 0; }
  .uneven { position: absolute; inset: 0;
    background: radial-gradient(150% 70% at var(--ux, 50%) 118%, rgba(255,255,255,0) 60%, rgba(255,255,255,.075) 65%, rgba(255,255,255,0) 71%); }
  .scratch { position: absolute; inset: 0; background-size: 340px 340px; background-position: var(--tx, 0) var(--ty, 0); opacity: var(--sk, .9);
    -webkit-mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.7) 26%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.1) 100%);
    mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.7) 26%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.1) 100%); }
  .wear { position: absolute; inset: 0; background-size: 100% 100%; opacity: var(--sk, .9);
    -webkit-mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.75) 30%, rgba(0,0,0,.32) 62%, rgba(0,0,0,.24) 100%);
    mask-image: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), #000 0%, rgba(0,0,0,.75) 30%, rgba(0,0,0,.32) 62%, rgba(0,0,0,.24) 100%); }
  .crack { position: absolute; inset: 0; width: 100%; height: 100%; opacity: min(1, calc(var(--sk, .9) + .3)); }
  .crack path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: .8px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .spot { position: absolute; inset: 0;
    background: radial-gradient(circle at var(--lx, 30%) var(--ly, 22%), rgba(255,255,255,.2), rgba(255,255,255,.05) 22%, rgba(255,255,255,0) 42%); }
  .rim { position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 0 0 2px rgba(0,0,0,.3), inset 0 1px 0 1px rgba(255,255,255,.14); }

  /* ---------- Seiten: Deckelkante, Schlitz, klarer Boden mit dem Rücken des Einlegers ---------- */
  .side { overflow: hidden; background: #0d0d0e; }
  /* Rücken = linker (bzw. rechter) Streifen vom Cover, über die ganze Höhe */
  .side .inlay { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: var(--img) 0 50% / auto 100% no-repeat, #2c2c2e; }
  .side-l .inlay { left: 3%; right: 15%; }
  .side-r .inlay { left: 19%; right: 3%; background-position: 100% 50%; }
  .spine { writing-mode: vertical-rl; transform: rotate(180deg); font-size: calc(var(--t) * .34); font-weight: 700; letter-spacing: .08em;
    color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.6); white-space: nowrap; text-transform: uppercase; }
  .spine.r { transform: none; }
  .side .lidedge { position: absolute; top: 0; bottom: 0; }
  /* Scharnier-Seite: matt schwarz wie der geriffelte Rand */
  .side-l .lidedge { right: 0; width: 13%; background: repeating-linear-gradient(270deg, rgba(255,255,255,.04) 0 1px, rgba(0,0,0,0) 1px 3px), linear-gradient(270deg, #222225, #1a1a1c 60%, #1f1f21); }
  /* Öffnungs-Seite: klare Deckelkante */
  .side-r .lidedge { left: 0; width: 17%; background: linear-gradient(90deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 30%, rgba(255,255,255,.03) 70%, rgba(255,255,255,.12)), #141416; }
  /* Schlitz zwischen Deckel und Boden – hier öffnet man die Hülle */
  .side .seam { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #000; }
  .side-l .seam { right: 13%; box-shadow: -1px 0 0 rgba(255,255,255,.3), 1px 0 0 rgba(0,0,0,.4); }
  .side-r .seam { left: 17%; box-shadow: 1px 0 0 rgba(255,255,255,.38), -1px 0 0 rgba(255,255,255,.24); }
  /* klare Plastikwand: helle Brechungskanten, Licht wandert mit */
  .side .wall { position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,0) 7%, rgba(255,255,255,0) 93%, rgba(255,255,255,.12)),
      linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0) 4%, rgba(255,255,255,0) 96%, rgba(255,255,255,.08)),
      linear-gradient(180deg, rgba(255,255,255,0) 15%, rgba(255,255,255,var(--sl, .06)) 50%, rgba(255,255,255,0) 85%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
  .side-l .wall { right: 13%; }

  /* ---------- Rückseite: Einleger mit Titelliste hinter dem klaren Boden ---------- */
  .back { overflow: hidden; border-radius: 1px; background: #0b0b0c; }
  .bk-inlay { position: absolute; left: 1.8%; right: 6.5%; top: 2.6%; bottom: 2.6%; overflow: hidden; display: flex; flex-direction: column;
    padding: 5.5% 6% 4%; color: #fff; letter-spacing: 0;
    background: linear-gradient(180deg, rgba(8,8,10,.6), rgba(8,8,10,.8)), var(--img) 35% 45% / 280% auto no-repeat, #1c1c1e;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.7); }
  .bk-head { display: flex; align-items: center; gap: 4%; }
  .bk-head div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bk-head small { font-size: calc(var(--s) * .032); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .bk-head b { font-size: calc(var(--s) * .062); font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-head .play { flex: none; width: calc(var(--s) * .11); height: calc(var(--s) * .11); border-radius: 50%; background: #fff; color: #000;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .bk-head .play svg { width: 44%; height: 44%; margin-left: 8%; }
  .bk-inlay ol { flex: 1; min-height: 0; margin: calc(var(--s) * .035) 0 0; padding: 0; list-style: none; overflow: hidden;
    --lh: calc(var(--s) * .56 / var(--rows)); font-size: min(calc(var(--s) * .043), calc(var(--lh) * .72)); line-height: var(--lh); color: rgba(255,255,255,.92); }
  .bk-inlay ol.two { columns: 2; column-gap: calc(var(--s) * .04); }
  .bk-inlay li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; break-inside: avoid; }
  .bk-inlay li b { display: inline-block; min-width: 1.7em; font-weight: 600; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
  .bk-foot { display: flex; align-items: flex-end; justify-content: space-between; font-size: calc(var(--s) * .026); color: rgba(255,255,255,.5); }
  .barcode { display: block; width: calc(var(--s) * .17); height: calc(var(--s) * .075); border: calc(var(--s) * .008) solid #fff;
    background: repeating-linear-gradient(90deg, #111 0 1px, #fff 1px 2px, #111 2px 4px, #fff 4px 5px, #111 5px 6px, #fff 6px 8px, #111 8px 9px, #fff 9px 11px); }
  .bk-hinge { position: absolute; right: 0; top: 0; bottom: 0; width: 6%; background: linear-gradient(270deg, #1d1d20, #19191b 60%, #202023); box-shadow: inset 1px 0 0 rgba(0,0,0,.6); }

  /* ---------- Spiegelung auf dem Boden: die ganze Hülle (mit Rücken) gespiegelt ---------- */
  .mirror { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d; pointer-events: none;
    transform-origin: 50% 100%; transform: translateY(3px) scaleY(-1); }
  .mirror .face::after, .mirror .core::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.56), rgba(0,0,0,.88) 22%, #000 40%); }
  .stage.inspect .mirror { display: none; }
</style>
</head>
<body>
<div class="top" id="hint">Wischen zum Blättern · Tippen zum Umdrehen</div>
<div class="stage" id="stage"></div>
<div class="info"><b id="t"></b><span id="u"></span></div>
<div class="opts">
  <div class="row"><small>Ansicht</small>
    <div class="seg" id="mode"><button data-v="flow" class="on">Blättern</button><button data-v="inspect">Von nah drehen</button></div>
  </div>
  <div class="row"><small>Kratzer</small>
    <div class="seg" id="sk"><button data-v="0">aus</button><button data-v=".55">wenig</button><button data-v=".9" class="on">mittel</button><button data-v="1.35">stark</button></div>
  </div>
</div>
<script>
// Test-Alben (Green Day) – Cover vom Cover Art Archive
const ALBUMS = [
  ['Kerplunk!', '1991', 'a0603694-2422-3a40-b946-d0bcea5e8254'],
  ['Dookie', '1994', '314cffd4-daa5-3337-85e5-e54165a96113'],
  ['Insomniac', '1995', '061f572e-7660-3c6b-b4cd-cf66d46da93c'],
  ['nimrod.', '1997', '4f1d08f2-d4bd-3ef2-ba72-eb348ae4c332'],
  ['Warning:', '2000', 'c1604b20-37b8-3fc7-8726-73f41090b8e2'],
  ['American Idiot', '2004', 'de9bf827-a9b0-348b-a7c9-556c03c3fb07'],
  ['21st Century Breakdown', '2009', '37608ff2-3168-3e7c-a77e-04a4b7300c1b'],
  ['Revolution Radio', '2016', '6721d62d-8d2d-4747-8548-308ecc4b914b'],
  ['Saviors', '2024', 'c1417e42-7eac-4817-bb1e-dba7a7ba044e'],
];
const TRACKS = ['Burnout', 'Having a Blast', 'Chump', 'Longview', 'Welcome to Paradise', 'Pulling Teeth', 'Basket Case', 'She', 'Sassafras Roots', 'When I Come Around', 'Coming Clean', 'Emenius Sleepus', 'In the End', 'F.O.D.'];
const cover = (a, px) => `https://coverartarchive.org/release-group/${a[2]}/front-${px}`;
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13 -8z" fill="currentColor"/></svg>';

// Zufall mit festem Startwert: jede Hülle hat immer dieselben kleinen Macken
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Mikrokratzer (Haarlinien, Putz-Kringel, Staub) – einmal erzeugen ----------
function scratchTexture() {
  const S = 680, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d'), r = rng(5);
  g.lineCap = 'round';
  for (let i = 0; i < 420; i++) {
    const x = r() * S, y = r() * S, len = 6 + r() * r() * 90, a = r() * Math.PI;
    g.strokeStyle = `rgba(255,255,255,${0.14 + r() * 0.4})`;
    g.lineWidth = r() < 0.8 ? 1.2 : 2;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len / 2 + (r() - 0.5) * 6, y + Math.sin(a) * len / 2 + (r() - 0.5) * 6, x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  for (let k = 0; k < 2; k++) {
    const cx = r() * S, cy = r() * S;
    for (let i = 0; i < 80; i++) {
      const rad = 40 + r() * S * 0.6, a0 = r() * Math.PI * 2;
      g.strokeStyle = `rgba(255,255,255,${0.06 + r() * 0.16})`;
      g.lineWidth = 1.1;
      g.beginPath(); g.arc(cx, cy, rad, a0, a0 + 0.08 + r() * 0.45); g.stroke();
    }
  }
  for (let i = 0; i < 220; i++) {
    g.fillStyle = `rgba(255,255,255,${0.1 + r() * 0.45})`;
    g.beginPath(); g.arc(r() * S, r() * S, r() < 0.9 ? 1 : 1.8, 0, Math.PI * 2); g.fill();
  }
  return c.toDataURL('image/png');
}

// ---------- Gebrauchsspuren: Abrieb an Kanten und Ecken, Fingerabdruck, Staub ----------
function wearTexture(seed) {
  const W = 640, H = 584, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d'), r = rng(seed);
  g.lineCap = 'round';
  const line = (x, y, a, len, alpha, lw) => {
    g.strokeStyle = `rgba(255,255,255,${alpha})`; g.lineWidth = lw;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  };
  for (let i = 0; i < 320; i++) { // Abrieb an den Kanten (da reibt die Hülle im Regal)
    const side = Math.floor(r() * 4), along = r(), inset = Math.pow(r(), 2.5) * 0.08, wob = (r() - 0.5) * 0.5;
    const len = 4 + r() * r() * 46, alpha = 0.1 + r() * 0.35, lw = 1.2 + r() * 1.2;
    if (side === 0) line(along * W, inset * H, wob, len, alpha, lw);
    else if (side === 1) line(along * W, H - inset * H, wob, len, alpha, lw);
    else if (side === 2) line(inset * W, along * H, Math.PI / 2 + wob, len, alpha, lw);
    else line(W - inset * W, along * H, Math.PI / 2 + wob, len, alpha, lw);
  }
  for (const [cx, cy] of [[0, 0], [W, 0], [0, H], [W, H]]) { // abgestoßene Ecken
    for (let i = 0; i < 45; i++) {
      const dist = Math.pow(r(), 1.6) * 0.09 * W, a = r() * Math.PI * 2;
      const x = cx + (cx ? -1 : 1) * Math.abs(Math.cos(a)) * dist, y = cy + (cy ? -1 : 1) * Math.abs(Math.sin(a)) * dist;
      line(x, y, r() * Math.PI, 2 + r() * 12, 0.15 + r() * 0.4, 1 + r() * 1.4);
    }
  }
  const fx = W * (0.55 + r() * 0.3), fy = H * (0.55 + r() * 0.3); // Fingerabdruck
  g.save(); g.translate(fx, fy); g.rotate(r() * Math.PI);
  const sm = g.createRadialGradient(0, 0, 0, 0, 0, 70);
  sm.addColorStop(0, 'rgba(255,255,255,.07)'); sm.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sm; g.beginPath(); g.ellipse(0, 0, 70, 56, 0, 0, Math.PI * 2); g.fill();
  g.lineWidth = 1.3;
  for (let k = 5; k < 50; k += 3.2) {
    for (let a = 0; a < Math.PI * 2; a += 0.5 + r() * 0.5) {
      g.strokeStyle = `rgba(255,255,255,${0.05 + r() * 0.07})`;
      g.beginPath(); g.ellipse(0, 0, k * 1.25, k, 0, a, a + 0.25 + r() * 0.5); g.stroke();
    }
  }
  g.restore();
  for (let i = 0; i < 70; i++) { // Staubkörnchen
    g.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.5})`;
    g.beginPath(); g.arc(r() * W, r() * H, r() < 0.85 ? 1 : 2, 0, Math.PI * 2); g.fill();
  }
  return c.toDataURL('image/png');
}
const TEX = scratchTexture();
const WEAR = [11, 23, 37].map(wearTexture);
// feiner Haarriss am Scharnier (klassischer Jewel-Case-Schaden) – nur bei manchen Hüllen
const CRACK = `<svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0.2 1.2 L1.74 4.6 L1.3 6.4 L3.7 10.8 L3.26 12.6"/><path d="M1.74 4.6 L4.78 5.6"/></svg>`;

// Glanzschicht: Licht, Kratzer, Abrieb
function gloss(seed, cls, crack) {
  return `<div class="gloss ${cls}">
    <div class="lip t"></div><div class="lip b"></div><div class="sheen"></div><div class="uneven"></div>
    <div class="scratch" style="background-image:url(${TEX});--tx:${(seed * 137) % 340}px;--ty:${(seed * 211) % 340}px"></div>
    <div class="wear" style="background-image:url(${WEAR[seed % 3]})"></div>
    ${crack ? CRACK : ''}<div class="spot"></div><div class="rim"></div>
  </div>`;
}

// Vorderseite. full=false: vereinfacht für die Spiegelung
function frontHtml(a, i, full) {
  const r = rng(i * 7 + 3);
  const rot = ((r() - 0.5) * 0.7).toFixed(2), ox = ((r() - 0.5) * 1.2).toFixed(2), oy = ((r() - 0.5) * 1.2).toFixed(2);
  return `<div class="face front"><div class="lid">
    <div class="tray"></div><div class="ribs"></div>
    <div class="booklet" style="background-image:url('${cover(a, 500)}');--rot:${rot}deg;--ox:${ox}px;--oy:${oy}px"></div>
    <div class="tab r1"></div><div class="tab r2"></div><div class="tab l1"></div><div class="tab l2"></div>
    ${full ? gloss(i, '', i % 4 === 2) : ''}
  </div></div>`;
}
function sideHtml(a, which, full) {
  return `<div class="face side side-${which}">
    <div class="inlay"><span class="spine${which === 'r' ? ' r' : ''}">Green Day · ${a[0]}</span></div>
    <div class="lidedge"></div><div class="seam"></div>
    ${full ? '<div class="wall"></div>' : ''}
  </div>`;
}
function backHtml(a, i, full) {
  const n = TRACKS.length, cols = n > 9 ? 2 : 1, rows = Math.ceil(n / cols);
  return `<div class="face back">
    <div class="bk-inlay">${full ? `
      <div class="bk-head"><div><small>Green Day</small><b>${a[0]}</b></div><span class="play">${PLAY}</span></div>
      <ol class="${cols === 2 ? 'two' : ''}" style="--rows:${rows}">${TRACKS.map((t, k) => `<li><b>${k + 1}</b>${t}</li>`).join('')}</ol>
      <div class="bk-foot"><span>℗ ${a[1]} Green Day</span><i class="barcode"></i></div>` : ''}
    </div>
    <div class="bk-hinge"></div>
    ${full ? gloss(i + 5, 'bk', false) : ''}
  </div>`;
}
const BEVELS = '<div class="face bev fl"></div><div class="face bev fr"></div><div class="face bev bl"></div><div class="face bev br"></div>';

const stage = document.getElementById('stage');
stage.innerHTML = ALBUMS.map((a, i) => `<div class="item" data-i="${i}">
  <div class="jc" style="--img:url('${cover(a, 250)}')">
    <div class="core"></div>
    ${frontHtml(a, i, true)}${BEVELS}${sideHtml(a, 'l', true)}${sideHtml(a, 'r', true)}
    <div class="face top-f"></div><div class="face bot-f"></div>
    ${backHtml(a, i, true)}
    <div class="mirror"><div class="core"></div>${frontHtml(a, i, false)}${BEVELS}${sideHtml(a, 'l', false)}${sideHtml(a, 'r', false)}${backHtml(a, i, false)}</div>
  </div>
</div>`).join('');
const els = [...stage.querySelectorAll('.item')];

let pos = 1, target = 1, raf = 0, shown = -1, flipped = -1;
let mode = 'flow', rx = 4, ry = -32;
const clampI = (v) => Math.max(0, Math.min(ALBUMS.length - 1, v));
const size = () => (mode === 'inspect'
  ? Math.round(Math.min(stage.clientWidth * 0.66, stage.clientHeight * 0.62, 380))
  : Math.round(Math.min(stage.clientWidth * 0.44, stage.clientHeight * 0.55, 280)));

// Licht: k = wie weit die Hülle seitlich gedreht ist (0 = gerade von vorn)
function light(el, k, tilt) {
  const ak = Math.abs(k);
  el.style.setProperty('--lx', `${(32 - k * 70).toFixed(1)}%`);
  el.style.setProperty('--ly', `${(20 + Math.min(ak, 2) * 8 - tilt * 1.6).toFixed(1)}%`);
  el.style.setProperty('--sx', `${(50 + k * 55).toFixed(1)}%`);
  el.style.setProperty('--ux', `${(50 + k * 95).toFixed(1)}%`);
  el.style.setProperty('--bvr', (0.12 + 0.42 * Math.max(0, Math.min(1, k))).toFixed(3));
  el.style.setProperty('--sl', (0.03 + 0.12 * Math.min(1, ak)).toFixed(3));
}

function layout() {
  const s = size(), w = s * 1.136;
  const cur = clampI(Math.round(pos));
  els.forEach((el, i) => {
    const d = i - pos, ad = Math.abs(d);
    if (mode === 'inspect') {
      if (i !== cur) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.firstElementChild.style.setProperty('--s', `${s}px`);
      el.style.transform = `translate3d(0,0,${(s * 0.1).toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      el.style.zIndex = '1000';
      light(el, -ry / 70, rx);
      return;
    }
    if (ad > 5) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.firstElementChild.style.setProperty('--s', `${s}px`);
    // weich hinaus- und hereindrehen (wie beim iPod): Drehung, Versatz und Tiefe folgen derselben sanften Kurve,
    // seitlich liegen die Hüllen weiter auseinander, damit nichts ruckartig springt
    const e = Math.sin(Math.min(1, ad) * Math.PI / 2), sg = Math.sign(d);
    const x = sg * (e * 0.4 + ad * 0.21) * w;
    const z = -e * 0.5 * s;
    el.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${(-sg * e * 68).toFixed(2)}deg)`;
    el.style.zIndex = String(1000 - Math.round(ad * 100));
    light(el, d, 0);
  });
  if (cur !== shown) {
    shown = cur;
    document.getElementById('t').textContent = ALBUMS[cur][0];
    document.getElementById('u').textContent = `Green Day · ${ALBUMS[cur][1]}`;
    if (flipped >= 0 && flipped !== cur) { els[flipped].classList.remove('flipped'); flipped = -1; }
  }
}
function animate() {
  cancelAnimationFrame(raf);
  const step = () => {
    const diff = target - pos;
    if (Math.abs(diff) < 0.002) { pos = target; layout(); return; }
    pos += diff * 0.14; layout(); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function toggleFlip(i) {
  if (flipped === i) { els[i].classList.remove('flipped'); flipped = -1; }
  else { if (flipped >= 0) els[flipped].classList.remove('flipped'); els[i].classList.add('flipped'); flipped = i; }
}

let drag = null;
stage.addEventListener('pointerdown', (e) => {
  cancelAnimationFrame(raf);
  drag = { x: e.clientX, y: e.clientY, pos, rx, ry, lastX: e.clientX, lastT: performance.now(), vel: 0, moved: false, item: e.target.closest('.item') };
  try { stage.setPointerCapture(e.pointerId); } catch {}
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
  if (mode === 'inspect') { // Hülle frei drehen, um Kanten, Schlitz und Kratzer anzuschauen
    ry = Math.max(-85, Math.min(85, drag.ry + dx * 0.45));
    rx = Math.max(-16, Math.min(16, drag.rx - dy * 0.3));
    layout();
    return;
  }
  const s = size() * 0.3;
  pos = Math.max(-0.4, Math.min(ALBUMS.length - 0.6, drag.pos - dx / s));
  const now = performance.now(), dt = Math.max(1, now - drag.lastT);
  drag.vel = drag.vel * 0.6 + (-(e.clientX - drag.lastX) / s / dt * 1000) * 0.4;
  drag.lastX = e.clientX; drag.lastT = now;
  layout();
});
const end = () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (mode === 'inspect') { if (!d.moved) toggleFlip(clampI(Math.round(pos))); return; }
  if (!d.moved) {
    const i = d.item ? Number(d.item.dataset.i) : Math.round(pos);
    if (i === Math.round(target) && Math.abs(pos - i) < 0.3) toggleFlip(i);
    else { target = i; animate(); }
    return;
  }
  target = clampI(Math.round(pos + Math.max(-6, Math.min(6, d.vel * 0.22))));
  animate();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
window.addEventListener('resize', layout);

function seg(id, fn) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b));
    fn(b.dataset.v);
  });
}
seg('sk', (v) => document.documentElement.style.setProperty('--sk', v));
seg('mode', (v) => {
  cancelAnimationFrame(raf);
  mode = v;
  pos = target = clampI(Math.round(pos));
  rx = 4; ry = -32;
  stage.classList.toggle('inspect', v === 'inspect');
  document.getElementById('hint').textContent = v === 'inspect' ? 'Ziehen zum Drehen · Tippen zum Umdrehen' : 'Wischen zum Blättern · Tippen zum Umdrehen';
  layout();
});
layout();
</script>
</body>
</html>
