<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test: Regal</title>
<!-- Test: Startbildschirm als CD-Regal – schlicht, schwarzer Klavierlack.
     Jede Reihe = ein Interpret, von der Seite gesehen: alle Studioalben als CD-Rücken (eigene farbig, fehlende grau),
     darunter eine leichte Spiegelung im Lack. Antippen öffnet den Interpreten im Cover Flow. Gehört (noch) nicht zur App. -->
<style>
  :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #000; color: #fff;
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.43px; }
  button { font: inherit; }
  .bar { position: fixed; z-index: 20; left: 0; right: 0; top: 0; padding: calc(var(--safe-top) + 8px) 12px 8px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.55)); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
  .bar h1 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 0; color: #fff; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); box-shadow: inset 0 1px .5px rgba(255,255,255,.45), inset 0 0 0 .5px rgba(255,255,255,.14); }
  .round svg { width: 22px; height: 22px; }

  .shelf { padding: calc(var(--safe-top) + 64px) 0 calc(var(--safe-bottom) + 40px); }
  /* eine Reihe = ein Interpret */
  .row { position: relative; padding: 8px 0 0; cursor: pointer; }
  .row-head { display: flex; align-items: baseline; gap: 8px; padding: 0 18px; }
  .row-head b { font-size: 17px; font-weight: 600; letter-spacing: -.43px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-head span { flex: none; font-size: 13px; color: rgba(235,235,245,.5); }
  /* die CDs stehen auf schwarzem Klavierlack und spiegeln sich leicht darin */
  .spines { display: flex; align-items: flex-end; gap: 1px; padding: 6px 18px 0; overflow-x: auto; scrollbar-width: none;
  }
  .spines::-webkit-scrollbar { display: none; }
  .lacquer { height: 8px; margin-top: 1px; position: relative; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 30%); }
  /* Vorderkante des Lackbodens: ein feiner Glanz */
  .lacquer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35) 30%, rgba(255,255,255,.18) 70%, rgba(255,255,255,0)); }
  .row:active .sp { filter: brightness(1.15); }
  .row:active .sp.missing { filter: grayscale(1) brightness(.68); }

  /* CD-Rücken (2D), wie auf der Hülle */
  .sp { position: relative; flex: none; width: var(--spW); height: var(--spH); background: #0d0d0e; border-radius: 1px;
    transition: transform .35s cubic-bezier(.3,.8,.3,1); }
  .sp i { position: absolute; display: block; }
  .sp .plate { left: 0; top: 0; bottom: 0; width: 21%; background: linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, rgba(255,255,255,.16) 1px, rgba(255,255,255,.26) 55%, rgba(255,255,255,.08)), #26262b; }
  .sp .inl { left: 21%; right: 2.5%; top: 2.4%; bottom: 2.4%; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: #2c2c2e 0 50% / auto 100% no-repeat; }
  .sp .inl span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 700; font-size: calc(var(--spW) * .5); letter-spacing: .05em;
    text-transform: uppercase; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.6); }
  .sp.scan .inl span { display: none; }
  .sp .seam { right: 0; top: 0; bottom: 0; width: 1px; background: #000; box-shadow: -1px 0 0 rgba(255,255,255,.28); }
  .sp .cap { left: 0; right: 0; height: 2.4%; background: linear-gradient(180deg, rgba(255,255,255,.45) 0 1px, rgba(255,255,255,.14) 1px, rgba(255,255,255,.24) 60%, rgba(0,0,0,.5)), #2a2a2f; }
  .sp .cap.t { top: 0; } .sp .cap.b { bottom: 0; transform: scaleY(-1); }
  .sp .gl { inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.12)),
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(0,0,0,.25)); }
  /* Alben, die du nicht hast: grau */
  .sp.missing { filter: grayscale(1) brightness(.55); }
  /* angetippt: die CDs der Reihe rücken kurz nach vorn */
  .row.go .sp { transform: translateY(-6px); }

  .toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--safe-bottom) + 28px); transform: translate(-50%, 20px); max-width: 86vw; padding: 12px 18px; border-radius: 18px;
    font-size: 15px; text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    background: linear-gradient(180deg, rgba(60,60,64,.92), rgba(30,30,32,.95)); box-shadow: inset 0 1px .5px rgba(255,255,255,.35), 0 10px 30px rgba(0,0,0,.6); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .src { padding: 26px 24px 0; text-align: center; font-size: 12px; color: rgba(235,235,245,.38); }
</style>
</head>
<body>
<div class="bar">
  <button class="round" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1>Regal</h1>
  <button class="round" aria-label="Hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="shelf" id="shelf"></div>
<div class="toast" id="toast"></div>
<script type="module">
import { getCache, setCache, db } from '../js/db.js';
import * as mb from '../js/musicbrainz.js';
import * as jewel from '../js/jewel.js';

// Beispiel-Sammlung (nur wenn in diesem Browser keine eigene Sammlung gespeichert ist)
const DEMO = [{"name": "AC/DC", "mbid": "66c662b6-6e2f-4930-8610-912e24c63ed1", "albums": [{"t": "High Voltage", "y": "1975", "id": "2b81e645-4586-4456-843a-9bc19a217470"}, {"t": "Highway to Hell", "y": "1979", "id": "f85647ec-a69b-3b0a-ad04-bb6076c4dcf1"}, {"t": "Blow Up Your Video", "y": "1988", "id": "baab9433-37a8-32ee-a1d3-34c7d6cf6e69"}]}, {"name": "Beatsteaks", "mbid": "a9b88ebb-83aa-4ef7-b674-fabeb572c14e", "albums": [{"t": "48/49", "y": "1997", "id": "ee3266d3-e5aa-330b-909c-4bee920c848d"}, {"t": "Smack Smash", "y": "2004", "id": "dcb8966b-fc70-3f4b-a6e3-18873526acc2"}, {"t": "Boombox", "y": "2011", "id": "f5c1c72b-86e8-44bc-a6d9-2c72ebab6ede"}]}, {"name": "Billie Eilish", "mbid": "f4abc0b5-3f7a-4eff-8f78-ac078dbce533", "albums": [{"t": "WHEN WE ALL FALL ASLEEP, WHERE DO WE GO?", "y": "2019", "id": "72375978-a9a1-4254-b957-85565c716b7e"}, {"t": "Happier Than Ever", "y": "2021", "id": "3ac5236a-3bd8-44c6-ab60-69b013594ae6"}, {"t": "HIT ME HARD AND SOFT", "y": "2024", "id": "02a544b3-0459-42c7-bd9c-047162e7b67a"}]}, {"name": "blink‐182", "mbid": "0743b15a-3c32-48c8-ad58-cb325350befa", "albums": [{"t": "Cheshire Cat", "y": "1995", "id": "0a467c9c-c9f7-3a86-bce1-c013e3bacd5f"}, {"t": "Take Off Your Pants and Jacket", "y": "2001", "id": "e9acecde-4ae1-3430-baf7-eae53cb9d75f"}, {"t": "California", "y": "2016", "id": "986ceaa4-3a6e-4ec8-acb9-79d3110fc94b"}]}, {"name": "Die Ärzte", "mbid": "f2fb0ff0-5679-42ec-a55c-15109ce6e320", "albums": [{"t": "Debil", "y": "1984", "id": "26535caf-778b-3392-bbf6-ff16a712bbcb"}, {"t": "Das ist nicht die ganze Wahrheit …", "y": "1988", "id": "33b626b4-dc26-3dde-add7-6daa558f77fd"}, {"t": "Le Frisur", "y": "1996", "id": "7388f7e7-090b-3f9f-aad9-154d45b10115"}, {"t": "5, 6, 7, 8 - Bullenstaat!", "y": "2001", "id": "593a4cad-dc87-3981-9ef7-4847ce3cff15"}, {"t": "Jazz ist anders", "y": "2007", "id": "4890f5c7-389e-380e-99e8-0b2b3cbc9b8f"}]}, {"name": "Foo Fighters", "mbid": "67f66c07-6e61-4026-ade5-7e782fad3a5d", "albums": [{"t": "Foo Fighters", "y": "1995", "id": "440c9ce8-8ce4-3103-a745-0b385ae70a34"}, {"t": "In Your Honor", "y": "2005", "id": "304479f9-ea77-3299-8745-3985f05cfa13"}, {"t": "Concrete and Gold", "y": "2017", "id": "e0335c44-58cd-433c-86d3-e114b14b7111"}]}, {"name": "Green Day", "mbid": "084308bd-1654-436f-ba03-df6697104e19", "albums": [{"t": "Kerplunk!", "y": "1991", "id": "a0603694-2422-3a40-b946-d0bcea5e8254"}, {"t": "Dookie", "y": "1994", "id": "314cffd4-daa5-3337-85e5-e54165a96113"}, {"t": "Insomniac", "y": "1995", "id": "061f572e-7660-3c6b-b4cd-cf66d46da93c"}, {"t": "nimrod.", "y": "1997", "id": "4f1d08f2-d4bd-3ef2-ba72-eb348ae4c332"}, {"t": "Warning:", "y": "2000", "id": "c1604b20-37b8-3fc7-8726-73f41090b8e2"}, {"t": "American Idiot", "y": "2004", "id": "de9bf827-a9b0-348b-a7c9-556c03c3fb07"}, {"t": "21st Century Breakdown", "y": "2009", "id": "37608ff2-3168-3e7c-a77e-04a4b7300c1b"}]}, {"name": "Linkin Park", "mbid": "f59c5520-5f46-4d2c-b2c4-822eabf53419", "albums": [{"t": "Hybrid Theory", "y": "2000", "id": "b5b4bb4b-8ba5-3acf-88cb-4cae2699d8da"}, {"t": "Minutes to Midnight", "y": "2007", "id": "a4201f5c-f0d7-319c-ba9d-ba0bac38da7a"}, {"t": "Living Things", "y": "2012", "id": "af682b63-021e-4806-afac-9aa4380fc6bd"}, {"t": "One More Light", "y": "2017", "id": "b976c959-d13e-487c-85d7-cab70ed7c842"}]}, {"name": "Metallica", "mbid": "65f4f0c5-ef9e-490c-aee3-909e7ae6b2ab", "albums": [{"t": "Kill ’Em All", "y": "1983", "id": "f44f4f73-a714-31a1-a4b8-bfcaaf311f50"}, {"t": "Metallica", "y": "1991", "id": "e8f70201-8899-3f0c-9e07-5d6495bc8046"}, {"t": "Death Magnetic", "y": "2008", "id": "5c8a25bf-4764-3cce-8f37-30af79d3b101"}]}, {"name": "Muse", "mbid": "9c9f1380-2516-4fc9-a3e6-f9f61941d090", "albums": [{"t": "Showbiz", "y": "1999", "id": "a842d860-a023-3a71-ad2e-a3a94cffabd7"}, {"t": "Black Holes and Revelations", "y": "2006", "id": "af2e8e23-e9c3-4e67-8ad8-66387c5898fd"}, {"t": "Drones", "y": "2015", "id": "3133d4d5-5cfb-4f53-87f5-f3a97c8f310d"}]}, {"name": "Nirvana", "mbid": "5b11f4ce-a62d-471e-81fc-a69a8278c7da", "albums": [{"t": "Bleach", "y": "1989", "id": "f1afec0b-26dd-3db5-9aa1-c91229a74a24"}, {"t": "Nevermind", "y": "1991", "id": "1b022e01-4da6-387b-8658-8678046e4cef"}, {"t": "In Utero", "y": "1993", "id": "2a0981fb-9593-3019-864b-ce934d97a16e"}]}, {"name": "The Offspring", "mbid": "23a03e33-a603-404e-bcbf-2c00159d7067", "albums": [{"t": "The Offspring", "y": "1989", "id": "9eb1feb7-393b-34f3-865e-5e3bdaf1186a"}, {"t": "Ixnay on the Hombre", "y": "1997", "id": "8ef7ac07-793a-3aab-b14a-45f0c1ec4a2b"}, {"t": "Splinter", "y": "2003", "id": "2302fb6c-540b-4d16-a82f-e55821a2f23c"}]}, {"name": "Radiohead", "mbid": "a74b1b7f-71a5-4011-9441-d0b5e4122711", "albums": [{"t": "Pablo Honey", "y": "1993", "id": "cd76f76b-ff15-3784-a71d-4da3078a6851"}, {"t": "Kid A", "y": "2000", "id": "e75c0549-ad55-39e3-8025-c72c5d4a3c5d"}, {"t": "In Rainbows", "y": "2007", "id": "6e335887-60ba-38f0-95af-fae7774336bf"}]}, {"name": "Rammstein", "mbid": "b2d122f9-eadb-4930-a196-8f221eeb0c66", "albums": [{"t": "Herzeleid", "y": "1995", "id": "806eb9e1-06c6-385e-bf04-f3c5e2b4a6be"}, {"t": "Mutter", "y": "2001", "id": "833a9e1a-62c0-32f6-ab47-7797c4d83b07"}, {"t": "Rosenrot", "y": "2005", "id": "15e65e08-85d1-3145-85b2-e18b9fbd4cba"}]}, {"name": "Red Hot Chili Peppers", "mbid": "8bfac288-ccc5-448d-9573-c33ea2aa5c30", "albums": [{"t": "The Red Hot Chili Peppers", "y": "1984", "id": "cb453955-e748-31c2-91e6-db01681886a5"}, {"t": "Mother’s Milk", "y": "1989", "id": "a73f5707-e5a3-3dbd-94b3-bd84ccc828d8"}, {"t": "Californication", "y": "1999", "id": "ca5dfcc3-83fb-3eee-9061-c27296b77b2c"}, {"t": "I’m With You", "y": "2011", "id": "c9ffebc3-0e00-4ba7-bef6-980c98d623b6"}]}, {"name": "Wir sind Helden", "mbid": "908fedf4-548a-430f-b806-38fca9507dc4", "albums": [{"t": "Die Reklamation", "y": "2003", "id": "edc9b7d3-b026-3287-a85b-a604a4922760"}, {"t": "Von hier an blind", "y": "2005", "id": "3991fa25-cc26-34da-a011-56d9cc68fead"}, {"t": "Soundso", "y": "2007", "id": "20f6b3c3-0e90-377d-b2bc-cc30df297179"}]}];
const DAY = 864e5;
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const sortName = (s) => String(s || '').replace(/^(the|die|der|das)\s+/i, '');
const collator = new Intl.Collator('de', { sensitivity: 'base', numeric: true });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byYear = (a, b) => (a.y || '9999').localeCompare(b.y || '9999') || collator.compare(a.t, b.t);
const shelf = document.getElementById('shelf');

// ---------- Daten: eigene Sammlung (gleiche Adresse wie die App) oder Beispiel ----------
async function loadArtists() {
  try {
    const items = (await db.all('items')).filter((i) => i.type === 'cd');
    const map = new Map();
    for (const it of items) {
      const various = it.artistMbid === mb.VARIOUS_ARTISTS || /^(various artists|various|verschiedene( interpreten)?)$/i.test((it.artist || '').trim());
      const key = various ? 'various' : it.artistMbid ? `mb:${it.artistMbid}` : `name:${norm(it.artist) || 'unbekannt'}`;
      if (!map.has(key)) map.set(key, { key, mbid: various ? '' : (it.artistMbid || ''), name: various ? 'Sampler' : (it.artistName || it.artist || 'Unbekannt'), owned: [] });
      map.get(key).owned.push({ t: it.title, y: it.year || '', id: it.mbid || '', cover: it.cover || '' });
    }
    if (map.size >= 6) return { list: [...map.values()], mine: true };
  } catch {}
  return {
    list: DEMO.map((a) => ({ key: `mb:${a.mbid}`, mbid: a.mbid, name: a.name, owned: a.albums.map((b) => ({ ...b, cover: mb.coverUrl(b.id) })) })),
    mine: false,
  };
}

// Diskografie wie in der App (gleicher Zwischenspeicher): nur Studioalben, nichts aus der Zukunft
async function disco(mbid) {
  const c = await getCache(`mb:${mbid}`);
  if (c && Date.now() - c.at < 30 * DAY) return c.data;
  const data = await mb.artistAlbums(mbid);
  await setCache(`mb:${mbid}`, data);
  return data;
}
function allAlbums(a) {
  const today = new Date().toISOString().slice(0, 10);
  const list = (a.disco || []).filter((d) => !d.secondary.length && (!d.date || d.date <= today))
    .map((d) => ({ t: d.title, y: d.year, id: d.mbid, cover: d.cover, own: false }));
  for (const o of a.owned) {
    const hit = list.find((x) => (o.id && x.id === o.id) || norm(x.t) === norm(o.t));
    if (hit) { hit.own = true; if (o.id) hit.id = o.id; } else list.push({ ...o, own: true });
  }
  return list.sort(byYear);
}

// ---------- Reihen ----------
let ARTISTS = [];
function sizes() {
  const spH = Math.round(Math.max(110, Math.min(150, innerHeight * 0.165)));
  shelf.style.setProperty('--spH', `${spH}px`);
  shelf.style.setProperty('--spW', `${(spH * 0.083).toFixed(1)}px`); // Rücken: 10,4 × 125 mm
}
function spineHtml(a, b, k) {
  return `<div class="sp${b.own ? '' : ' missing'}" data-k="${k}"><i class="plate"></i>
    <i class="inl" style="background-image:url('${esc(b.cover)}')"><span>${esc(a.name)} · ${esc(b.t)}</span></i>
    <i class="seam"></i><i class="cap t"></i><i class="cap b"></i><i class="gl"></i></div>`;
}
function rowInner(a) {
  a.list = allAlbums(a);
  const own = a.list.filter((b) => b.own).length;
  const count = a.disco ? `${own} von ${a.list.length} Alben` : `${own} ${own === 1 ? 'Album' : 'Alben'}`;
  return `<div class="row-head"><b>${esc(a.name)}</b><span>${count}</span></div>
    <div class="spines">${a.list.map((b, k) => spineHtml(a, b, k)).join('')}</div><div class="lacquer"></div>`;
}
function render() {
  sizes();
  shelf.innerHTML = ARTISTS.map((a, i) => `<section class="row" data-a="${i}">${rowInner(a)}</section>`).join('') + `<div class="src">${esc(SRC)}</div>`;
  observe();
}
function refreshRow(i) {
  const el = shelf.querySelector(`.row[data-a="${i}"]`);
  if (!el) return;
  el.innerHTML = rowInner(ARTISTS[i]);
}

// ---------- Nachladen: Diskografien, dann echte Rücken – sichtbare Reihen zuerst ----------
function ensureDisco(i) {
  const a = ARTISTS[i];
  if (!a.mbid) return Promise.resolve();
  return (a.discoP ||= disco(a.mbid).then((d) => { a.disco = d; refreshRow(i); }).catch(() => {}));
}
async function loadRow(i) {
  await ensureDisco(i);
  loadRowScans(i);
}
let io = null;
function observe() {
  io?.disconnect();
  io = new IntersectionObserver((ents) => {
    for (const e of ents) {
      if (!e.isIntersecting || e.target.dataset.seen) continue;
      e.target.dataset.seen = '1';
      loadRow(Number(e.target.dataset.a));
    }
  }, { rootMargin: '200px 0px' });
  shelf.querySelectorAll('.row').forEach((r) => io.observe(r));
}
async function loadRowScans(i) {
  const a = ARTISTS[i], now = a.list;
  const list = now.slice().sort((x, y) => (y.own ? 1 : 0) - (x.own ? 1 : 0)); // eigene zuerst
  for (const b of list) {
    if (!b.id) continue;
    const sc = await jewel.findScan(b.id).catch(() => null);
    if (a.list !== now) return; // Reihe wurde inzwischen neu aufgebaut
    const el = shelf.querySelector(`.row[data-a="${i}"] .sp[data-k="${now.indexOf(b)}"]`);
    if (!el || !sc || !(sc.ratio > 1.22)) continue;
    const total = 118 * sc.ratio, f = Math.min(0.065, Math.max(0.03, (total - 138) / 2 / total));
    const inl = el.querySelector('.inl');
    inl.style.backgroundImage = `url("${sc.small}")`;
    inl.style.backgroundSize = `${(100 / f).toFixed(1)}% 100%`;
    inl.style.backgroundPosition = '100% 50%';
    el.classList.add('scan');
  }
}

// ---------- Antippen: Interpret öffnen (in der App: Cover Flow mit seinen Alben) ----------
let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
let down = null;
shelf.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, row: e.target.closest('.row') }; });
shelf.addEventListener('pointerup', (e) => {
  const d = down; down = null;
  if (!d?.row || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) return; // gescrollt, nicht getippt
  const a = ARTISTS[d.row.dataset.a];
  d.row.classList.add('go');
  setTimeout(() => d.row.classList.remove('go'), 350);
  if (MINE) setTimeout(() => { location.href = `../#/flow/${encodeURIComponent(a.key)}`; }, 250);
  else toast(`In der App öffnet sich hier der Cover Flow von ${a.name}`);
});
addEventListener('resize', () => { sizes(); });

jewel.initJewel();
const data = await loadArtists();
const MINE = data.mine;
const SRC = MINE ? 'Deine Sammlung' : 'Beispiel-Sammlung – auf diesem Gerät ist keine eigene Sammlung gespeichert';
ARTISTS = data.list.sort((a, b) => collator.compare(sortName(a.name), sortName(b.name)));
render();
</script>
